name: CI

on:
  workflow_call:
    inputs:
      source:
        description: Exact commit to validate and package
        required: true
        type: string
  workflow_dispatch:
  push:
    branches: [master, 'codex/**']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build -- --githubBranch "$GITHUB_SHA"
        shell: bash
        env:
          GITHUB_SHA: ${{ inputs.source || github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: custom-plan-vsix-${{ matrix.os }}
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14
